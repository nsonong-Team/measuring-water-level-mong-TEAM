<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ลำน้ำโมง — สถานการณ์น้ำ จ.หนองบัวลำภู</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Kanit',sans-serif;background:#0d1b2a}
.scene{position:relative;width:100%;height:100vh;min-height:680px;overflow:hidden}

.sky{position:absolute;top:0;left:0;right:0;height:36%;
background:linear-gradient(180deg,#1a237e 0%,#283593 30%,#3949ab 55%,#5c6bc0 80%,#9fa8da 100%)}
.cloud{position:absolute;background:rgba(255,255,255,.1);border-radius:50%;filter:blur(18px)}
.cl{animation:cld 80s linear infinite}
@keyframes cld{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.mtns{position:absolute;top:20%;left:0;right:0;height:20%;pointer-events:none}
.ground{position:absolute;bottom:0;left:0;right:0;height:48%}
.gfill{position:absolute;inset:0;background:linear-gradient(180deg,#3e2723 0%,#2c1b0e 50%,#1a0e06 100%)}
.gtop{position:absolute;top:0;left:0;right:0;height:28px;background:linear-gradient(180deg,#2e7d32,#1b5e20,#0d3311)}
.ggrass{position:absolute;top:-6px;left:0;right:0;height:10px;overflow:hidden}
.gblade{position:absolute;bottom:0;width:2px;border-radius:1px 1px 0 0;transform-origin:bottom;animation:sw 3s ease-in-out infinite}
@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

.river{position:absolute;left:0;right:0;height:110px;bottom:165px;overflow:hidden}
.rbody{position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,35,126,.6),rgba(40,53,147,.7),rgba(57,73,171,.5),rgba(121,134,203,.3))}
.rsurf{position:absolute;top:0;left:0;width:300%;height:12px;
background:repeating-linear-gradient(90deg,transparent 0%,rgba(255,255,255,.2) 5%,transparent 10%);animation:wf 4s linear infinite}
@keyframes wf{from{transform:translateX(0)}to{transform:translateX(-33.33%)}}
.rp{position:absolute;background:rgba(255,255,255,.1);border-radius:50%;animation:pf 5s linear infinite}
@keyframes pf{from{transform:translateX(0);opacity:.2}50%{opacity:.4}to{transform:translateX(-33.33%);opacity:.1}}
.rbed{position:absolute;left:0;right:0;height:55px;bottom:110px;background:linear-gradient(180deg,#3e2723,#2c1b0e)}
.rbed-r{position:absolute;top:0;left:0;right:0;height:12px;background:repeating-linear-gradient(90deg,#4e342e 0px,#5d4037 12px,#3e2723 24px)}
.rname{position:absolute;font-size:38px;font-weight:800;color:rgba(255,255,255,.04);letter-spacing:20px}

.hdr{position:fixed;top:0;left:0;right:0;z-index:100;height:56px;
background:linear-gradient(90deg,rgba(13,27,42,.96),rgba(26,35,126,.92),rgba(13,27,42,.96));
backdrop-filter:blur(10px);border-bottom:2px solid rgba(92,107,192,.3);
display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.hl{display:flex;align-items:center;gap:10px}
.hlogo{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#5c6bc0,#7e57c2);font-size:20px;box-shadow:0 0 16px rgba(92,107,192,.4)}
.htitle{font-size:15px;font-weight:600;color:#c5cae9}
.hsub{font-size:10px;color:#9fa8da;font-weight:300}
.hr{display:flex;align-items:center;gap:14px}
.hk{text-align:center}.hkn{font-size:20px;font-weight:700}.hkl{font-size:8px;color:#9fa8da}
.hbadge{display:flex;align-items:center;gap:4px;padding:3px 12px;border-radius:20px;
background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.25);font-size:10px;color:#69f0ae}
.hdot{width:6px;height:6px;border-radius:50%;background:#69f0ae;animation:p 1.6s ease infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.hback{display:flex;align-items:center;gap:4px;padding:5px 14px;border-radius:6px;
background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#9fa8da;
font-size:11px;text-decoration:none;font-family:'Kanit';transition:.2s}
.hback:hover{background:rgba(255,255,255,.15)}

.gs{position:absolute;display:flex;flex-direction:column;align-items:center;z-index:10;transition:transform .3s}
.gs:hover{transform:translateY(-4px)}
.gtop2{display:flex;gap:6px;margin-bottom:6px}
.gbox{border-radius:6px;padding:5px 14px;font-size:16px;font-weight:700;text-align:center;
min-width:70px;font-family:'Sarabun';box-shadow:0 2px 8px rgba(0,0,0,.2);position:relative}
.gbox::after{content:attr(data-label);position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);
font-size:8px;color:rgba(255,255,255,.5);white-space:nowrap;font-weight:400}
.gbox.lv{background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff;border:1px solid rgba(76,175,80,.4)}
.gbox.lv.w{background:linear-gradient(135deg,#f57f17,#f9a825);color:#000}
.gbox.lv.c{background:linear-gradient(135deg,#c62828,#e53935);color:#fff}
.gbox.el{background:linear-gradient(135deg,#4527a0,#7b1fa2);color:#fff;border:1px solid rgba(149,117,205,.3)}

.ruler{position:relative;width:30px;height:160px;background:linear-gradient(180deg,#ffe082,#ffb300,#ff8f00);
border-radius:3px;border:2px solid #e65100;box-shadow:0 3px 12px rgba(0,0,0,.3),inset 0 0 8px rgba(0,0,0,.1)}
.rmk{position:absolute;right:0;background:rgba(0,0,0,.5)}
.rmk.mj{width:16px;height:2px}.rmk.mn{width:8px;height:1px}
.rnum{position:absolute;right:18px;font-size:8px;color:rgba(0,0,0,.6);font-family:'Sarabun';font-weight:700}
.wfill{position:absolute;bottom:0;left:2px;right:2px;border-radius:0 0 1px 1px;
background:linear-gradient(180deg,rgba(92,107,192,.75),rgba(26,35,126,.9));transition:height 1.2s ease}
.wline{position:absolute;left:-6px;right:-6px;height:3px;background:#fff;
box-shadow:0 0 12px rgba(255,255,255,.9),0 0 24px rgba(92,107,192,.5);transition:bottom 1.2s ease}

.scard{background:rgba(13,27,42,.88);backdrop-filter:blur(8px);border:1px solid rgba(92,107,192,.15);
border-radius:10px;padding:12px 16px;margin-top:8px;min-width:180px;text-align:center;
box-shadow:0 4px 20px rgba(0,0,0,.3);transition:border-color .3s}
.gs:hover .scard{border-color:rgba(92,107,192,.4)}
.sn{font-size:14px;font-weight:600;color:#9fa8da}
.sl{font-size:10px;color:rgba(159,168,218,.4);margin-bottom:4px}
.sd{font-size:10px;color:rgba(255,255,255,.5);line-height:1.6}.sd b{font-weight:700}
.ss{display:inline-block;font-size:10px;font-weight:600;padding:3px 12px;border-radius:14px;margin-top:5px}
.ss.g{background:rgba(76,175,80,.15);color:#69f0ae;border:1px solid rgba(76,175,80,.25)}
.ss.y{background:rgba(255,214,0,.15);color:#ffd600;border:1px solid rgba(255,214,0,.25)}
.ss.r{background:rgba(255,23,68,.15);color:#ff5252;border:1px solid rgba(255,23,68,.25)}

.dist-seg{position:absolute;display:flex;align-items:center;z-index:5}
.dist-line{flex:1;height:2px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.2),rgba(255,255,255,.05))}
.dist-box{background:rgba(92,107,192,.85);color:#fff;padding:4px 14px;border-radius:4px;
font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 2px 8px rgba(92,107,192,.3);font-family:'Sarabun'}

.legend{position:fixed;bottom:16px;right:16px;z-index:100;background:rgba(13,27,42,.9);
backdrop-filter:blur(8px);border:1px solid rgba(92,107,192,.15);border-radius:8px;padding:10px 14px}
.leg-t{font-size:10px;font-weight:500;color:#9fa8da;margin-bottom:4px}
.leg-i{display:flex;align-items:center;gap:6px;font-size:9px;color:rgba(255,255,255,.5);margin:2px 0}
.leg-d{width:10px;height:10px;border-radius:50%}
</style>
</head>
<body>
<div class="hdr">
<div class="hl">
<a href="index.html" class="hback">← กลับแผนที่หลัก</a>
<div class="hlogo">🌊</div>
<div><div class="htitle">ลำน้ำโมง — จ.หนองบัวลำภู</div><div class="hsub" id="dtLbl"></div></div>
</div>
<div class="hr">
<div class="hk"><div class="hkn" style="color:#69f0ae" id="hG">0</div><div class="hkl">ปกติ</div></div>
<div class="hk"><div class="hkn" style="color:#ffd600" id="hY">0</div><div class="hkl">เฝ้าระวัง</div></div>
<div class="hk"><div class="hkn" style="color:#ff5252" id="hR">0</div><div class="hkl">วิกฤติ</div></div>
<div class="hbadge"><span class="hdot"></span>LIVE</div>
</div>
</div>
<div class="legend">
<div class="leg-t">สัญลักษณ์</div>
<div class="leg-i"><span class="leg-d" style="background:#69f0ae"></span>ปกติ</div>
<div class="leg-i"><span class="leg-d" style="background:#ffd600"></span>เฝ้าระวัง</div>
<div class="leg-i"><span class="leg-d" style="background:#ff5252"></span>วิกฤติ</div>
</div>

<div class="scene" id="sc">
<div class="sky"><div class="cl" id="clds" style="position:absolute;top:0;left:0;width:200%;height:100%"></div></div>
<div class="mtns" id="mtns"></div>
<div class="ground"><div class="gfill"></div><div class="gtop"></div><div class="ggrass" id="gr"></div></div>
<div class="river"><div class="rbody"></div><div class="rsurf"></div><div id="rps"></div></div>
<div class="rbed"><div class="rbed-r"></div></div>
<div class="rname" style="bottom:200px;left:15%">ลำน้ำโมง</div>
<div class="rname" style="bottom:200px;right:15%">MONG RIVER</div>
<div id="sLayer"></div>
</div>

<script>
const ST=[
{id:11,nm:"คลองบุญทัน",vl:"บ.บุญทัน",ap:"สุวรรณคูหา",tb:"บุญทัน",el:231,rd:231,yl:230.5,gm:230,ds:6},
{id:12,nm:"บ้านโคก",vl:"บ.โคก",ap:"สุวรรณคูหา",tb:"บ้านโคก",el:218,rd:218,yl:217.5,gm:217,ds:13.6}
];
let LV={};ST.forEach(s=>{const b=s.gm-1.5,r=s.rd-b;LV[s.id]=Math.round((b+Math.random()*r*.6)*100)/100});
function gs2(s,l){if(l>=s.rd)return{t:'วิกฤติ',c:'r',f:'ธงแดง',cls:'c',e:'🔴'};if(l>=s.yl)return{t:'เฝ้าระวัง',c:'y',f:'ธงเหลือง',cls:'w',e:'🟡'};return{t:'ปกติ',c:'g',f:'ธงเขียว',cls:'',e:'🟢'}}
function build(){
const el=document.getElementById('sLayer');let h='';
const positions=[{x:'28%'},{x:'65%'}];
ST.forEach((s,i)=>{
const lv=LV[s.id],st=gs2(s,lv);
const wp=Math.max(5,Math.min(82,((lv-(s.gm-3))/(s.rd-s.gm+4))*65+12));
h+=`<div class="gs" style="left:${positions[i].x};bottom:255px;transform:translateX(-50%)">`;
h+=`<div class="gtop2"><div class="gbox lv ${st.cls}" data-label="ระดับน้ำ">${lv.toFixed(2)}</div><div class="gbox el" data-label="ม.รทก.">${s.el}</div></div>`;
h+=`<div class="ruler">`;
for(let m=0;m<=10;m++){const p=(1-m/10)*100;h+=`<div class="rmk mj" style="top:${p}%"></div>`;h+=`<div class="rnum" style="top:calc(${p}% - 4px)">${m*10}</div>`;
if(m<10)for(let u=1;u<=4;u++){h+=`<div class="rmk mn" style="top:${(1-(m+u*.2)/10)*100}%"></div>`}}
h+=`<div class="wfill" style="height:${wp}%"></div><div class="wline" style="bottom:${wp}%"></div></div>`;
h+=`<div class="scard"><div class="sn">${s.nm}</div><div class="sl">อ.${s.ap} ต.${s.tb}</div>`;
h+=`<div class="sd">ระดับ <b style="color:${st.c==='g'?'#69f0ae':st.c==='y'?'#ffd600':'#ff5252'}">${lv.toFixed(2)}</b> ม.รทก.<br>สูง <b style="color:#9fa8da">${s.el}</b> ม.รทก.</div>`;
h+=`<div class="ss ${st.c}">${st.e} ${st.f}</div></div></div>`;
});
// distance between
h+=`<div class="dist-seg" style="left:35%;bottom:128px;width:24%"><div class="dist-line"></div><div class="dist-box">${ST[0].ds} กม.</div><div class="dist-line"></div></div>`;
h+=`<div style="position:absolute;bottom:55px;left:15%;right:15%;display:flex;align-items:center;z-index:5"><div style="flex:1;height:1px;background:rgba(255,255,255,.1)"></div><div style="padding:0 12px;font-size:10px;color:rgba(255,255,255,.25)">▲ ต้นน้ำ (${ST[0].el} ม.รทก.) ━━━ ปลายน้ำ (${ST[1].el} ม.รทก.) ▼</div><div style="flex:1;height:1px;background:rgba(255,255,255,.1)"></div></div>`;
el.innerHTML=h}
function env(){
const c=document.getElementById('clds');let ch='';for(let i=0;i<20;i++){ch+=`<div class="cloud" style="width:${60+Math.random()*160}px;height:${20+Math.random()*40}px;left:${Math.random()*100}%;top:${5+Math.random()*55}%"></div>`}c.innerHTML=ch;
const m=document.getElementById('mtns');let mh='';const mc=['#1a237e','#283593','#1b5e20','#33691e'];
for(let i=0;i<12;i++){const w=160+Math.random()*300,ht=40+Math.random()*80,x=i*180;
mh+=`<div style="position:absolute;bottom:0;left:${x}px;width:0;height:0;border-left:${w/2}px solid transparent;border-right:${w/2}px solid transparent;border-bottom:${ht}px solid ${mc[i%4]};opacity:${.25+Math.random()*.35}"></div>`}m.innerHTML=mh;
const g=document.getElementById('gr');let gh='';for(let i=0;i<300;i++){gh+=`<div class="gblade" style="left:${i*6}px;height:${4+Math.random()*6}px;background:linear-gradient(180deg,#66bb6a,#43a047);animation-delay:${Math.random()*3}s"></div>`}g.innerHTML=gh;
const p=document.getElementById('rps');let ph='';for(let i=0;i<30;i++){const w=2+Math.random()*3;
ph+=`<div class="rp" style="width:${w}px;height:${w}px;left:${Math.random()*100}%;top:${10+Math.random()*80}%;animation-duration:${3+Math.random()*4}s;animation-delay:${Math.random()*5}s"></div>`}p.innerHTML=ph}
function kpi(){let g=0,y=0,r=0;ST.forEach(s=>{const x=gs2(s,LV[s.id]);if(x.c==='g')g++;else if(x.c==='y')y++;else r++});
document.getElementById('hG').textContent=g;document.getElementById('hY').textContent=y;document.getElementById('hR').textContent=r}
function dt(){document.getElementById('dtLbl').textContent='2 สถานี | '+new Date().toLocaleString('th-TH',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function sim(){ST.forEach(s=>{LV[s.id]=Math.round((LV[s.id]+(Math.random()-.48)*.12)*100)/100});build();kpi()}
env();build();kpi();dt();setInterval(sim,15000);setInterval(dt,60000);
</script>
</body>
</html>
